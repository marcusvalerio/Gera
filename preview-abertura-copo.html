<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abertura Copo</title>
<style>
:root{--navy:#0A2A66;--gold:#F5B400}
*{margin:0;box-sizing:border-box}
body{background:#051637;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;overflow:hidden;height:100vh}
.splash{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 30%,#173f8a,#0A2A66 50%,#051637)}
/* cerveja */
.beer{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#FFC93C 0%,#F5B400 35%,#E58A00 100%);animation:fill 2.4s cubic-bezier(.45,.05,.3,1) .3s forwards}
.beer::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.18) 0 8%,transparent 14% 80%,rgba(0,0,0,.12) 100%)}
@keyframes fill{to{height:88%}}
/* superfície com onda + espuma */
.foam{position:absolute;left:-10%;width:120%;top:-46px;height:70px}
.foam svg{width:100%;height:100%;display:block}
.wave1{animation:wave 1.6s ease-in-out infinite alternate}
.wave2{animation:wave 2.1s ease-in-out infinite alternate-reverse;opacity:.85}
@keyframes wave{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
.head{position:absolute;left:0;right:0;top:12px;height:0;background:#FFF8E7;animation:head 1s ease 2.4s forwards}
@keyframes head{to{height:9vh}}
/* bolhas */
.bubble{position:absolute;bottom:-10px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:inset -1px -1px 2px rgba(255,255,255,.6);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-95vh) translateX(var(--dx));opacity:0}}
/* texto */
.brand{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;text-align:center}
.title{font-size:clamp(36px,9vw,72px);font-weight:800;letter-spacing:-.02em;opacity:0;transform:translateY(20px);animation:up .7s ease 2.6s forwards;text-shadow:0 4px 18px rgba(120,60,0,.35)}
.title b{color:var(--navy)}
.tag{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--navy);font-weight:700;opacity:0;animation:up .7s ease 2.95s forwards}
.mark{width:84px;height:84px;opacity:0;animation:up .6s ease 2.45s forwards}
@keyframes up{to{opacity:1;transform:none}}
.out{animation:out .6s ease forwards}
@keyframes out{to{opacity:0;transform:scale(1.04)}}
.replay{position:fixed;right:16px;bottom:16px;z-index:10;border:0;border-radius:999px;padding:10px 16px;background:#fff;color:var(--navy);font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body>
<div class="splash" id="s">
  <div class="beer" id="beer">
    <div class="head"></div>
    <div class="foam"><svg viewBox="0 0 1200 70" preserveAspectRatio="none">
      <path class="wave2" fill="#FFE9B0" d="M0 40 Q75 18 150 40 T300 40 T450 40 T600 40 T750 40 T900 40 T1050 40 T1200 40 V70 H0Z"/>
      <path class="wave1" fill="#FFF8E7" d="M0 46 Q60 28 120 46 T240 46 T360 46 T480 46 T600 46 T720 46 T840 46 T960 46 T1080 46 T1200 46 V70 H0Z"/>
    </svg></div>
  </div>
  <div class="brand">
    <svg class="mark" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="#0A2A66" stroke-width="8"/><path d="M38 62 L54 78 L84 44" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="title">Gera <b>Atividade</b></div>
    <div class="tag">Planeje · Execute · Conclua</div>
  </div>
</div>
<button class="replay" onclick="location.reload()">↻ Ver de novo</button>
<script>
const beer=document.getElementById('beer');
for(let i=0;i<38;i++){const b=document.createElement('span');b.className='bubble';const s=3+Math.random()*9;
b.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${2+Math.random()*3}s;animation-delay:${.3+Math.random()*3}s;--dx:${(Math.random()-.5)*40}px`;beer.appendChild(b);}
setTimeout(()=>document.getElementById('s').classList.add('out'),4300);
</script>
</body></html>
